<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>SDK Test</title>

    <!-- Scoped Tailwind Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            prefix: 'avantos-', // Prefix all Tailwind classes
            corePlugins: {
                preflight: false, // Disable base styles
            },
            important: true, // Make styles important to override host styles
        }
    </script>

    <style>
        /* Namespace all SDK styles */
        .avantos-sdk-root {
            all: initial;
            display: block;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .avantos-sdk-root * {
            all: unset;
            box-sizing: border-box;
        }

        .avantos-sdk-root button {
            cursor: pointer;
            display: inline-block;
            font-family: inherit;
            text-align: center;
            margin: 0;
            padding: 0;
            background: none;
            border: none;
            line-height: normal;
        }
    </style>

    <script>
        // Utility to load scripts dynamically
        function loadScript(src, onLoad, onError) {
            const script = document.createElement('script');
            script.src = src;
            script.crossOrigin = 'anonymous';
            script.onload = onLoad;
            script.onerror = onError;
            document.head.appendChild(script);
        }

        // Error Handler
        function handleSDKError(error) {
            console.error('SDK Error:', error);
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                    <div style="color: red; padding: 20px;">
                        Error loading SDK: ${error.message || 'Unknown error'}
                    </div>
                `;
            }
        }

        // Global error handler
        window.onerror = function (msg, url, line) {
            console.error('Global error:', { message: msg, url, line });
            handleSDKError({ message: msg });
            return false;
        };

        // Check for existing React instance
        function getReact() {
            return window.React || window.parent.React || window.top.React;
        }

        function getReactDOM() {
            return window.ReactDOM || window.parent.ReactDOM || window.top.ReactDOM;
        }

        // Initialize the application
        function initApp() {
            try {
                const React = getReact();
                const ReactDOM = getReactDOM();

                if (!React) throw new Error('React not found in any context');
                if (!ReactDOM) throw new Error('ReactDOM not found in any context');
                if (typeof AvantosSdk === 'undefined') throw new Error('SDK not loaded');

                console.log('Initializing app with:', {
                    React: React.version,
                    ReactDOM: ReactDOM.version,
                    AvantosSdk
                });

                const { Button } = AvantosSdk;
                if (!Button) throw new Error('Button component not found in SDK');

                const App = () => {
                    return React.createElement('div', { className: 'tw-p-8' }, [
                        React.createElement('h1', {
                            className: 'tw-text-2xl tw-font-bold tw-mb-4',
                            key: 'title'
                        }, 'Avantos UI SDK Demo'),
                        React.createElement(Button, {
                            key: 'primary',
                            variant: 'primary',
                            size: 'medium',
                            onClick: () => alert('Primary clicked!')
                        }, 'Primary Button'),
                        React.createElement('div', {
                            key: 'spacer',
                            className: 'tw-h-4'
                        }),
                        React.createElement(Button, {
                            key: 'secondary',
                            variant: 'secondary',
                            size: 'medium',
                            onClick: () => alert('Secondary clicked!')
                        }, 'Secondary Button')
                    ]);
                };

                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            } catch (error) {
                console.error('Error initializing app:', error);
                handleSDKError(error);
            }
        }

        // Load dependencies in sequence
        window.process = { env: { NODE_ENV: 'production' } };

        function loadDependencies() {
            const React = getReact();
            const ReactDOM = getReactDOM();

            let loadCount = 0;
            const totalLoads = (!React ? 1 : 0) + (!ReactDOM ? 1 : 0) + 1; // +1 for SDK

            function checkAllLoaded() {
                loadCount++;
                if (loadCount === totalLoads) {
                    window.React = window.React || getReact();
                    window.ReactDOM = window.ReactDOM || getReactDOM();
                    if (document.readyState === 'complete') {
                        initApp();
                    } else {
                        window.addEventListener('load', initApp);
                    }
                }
            }

            // Load React if not present
            if (!React) {
                loadScript(
                    'https://unpkg.com/react@18.2.0/umd/react.production.min.js',
                    () => {
                        console.log('React loaded');
                        checkAllLoaded();
                    },
                    (error) => handleSDKError(new Error('Failed to load React'))
                );
            }

            // Load ReactDOM if not present
            if (!ReactDOM) {
                loadScript(
                    'https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js',
                    () => {
                        console.log('ReactDOM loaded');
                        checkAllLoaded();
                    },
                    (error) => handleSDKError(new Error('Failed to load ReactDOM'))
                );
            }

            // Load SDK
            loadScript(
                'https://csbnapses.github.io/ui-sdk/dist/index.global.js',
                () => {
                    console.log('SDK loaded successfully:', window.AvantosSdk);
                    checkAllLoaded();
                },
                (error) => handleSDKError(new Error('Failed to load SDK'))
            );
        }

        // Start loading dependencies
        loadDependencies();
    </script>


</head>

<body>
    <!-- Scoped container with namespace -->
    <div class="avantos-sdk-root">
        <div id="root"></div>
    </div>
</body>

</html>
