<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>SDK Test</title>

    <!-- Error Handler -->
    <script>
        function handleSDKError(error) {
            console.error('SDK Error:', error);
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                    <div style="color: red; padding: 20px;">
                        Error loading SDK: ${error.message || 'Unknown error'}
                    </div>
                `;
            }
        }

        // Global error handler
        window.onerror = function (msg, url, line) {
            console.error('Global error:', { message: msg, url, line });
            handleSDKError({ message: msg });
            return false;
        };
    </script>

    <!-- Include React 18 -->
    <script>window.process = { env: { NODE_ENV: 'production' } };</script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"
        onload="console.log('React loaded')" onerror="handleSDKError(new Error('Failed to load React'))"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"
        onload="console.log('ReactDOM loaded')" onerror="handleSDKError(new Error('Failed to load ReactDOM'))"></script>

    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Include our SDK -->
    <script>
        // Ensure window.exports exists
        window.exports = {};
    </script>
    <script src="https://csbnapses.github.io/ui-sdk/dist/index.global.js" type="text/javascript"
        onload="console.log('SDK loaded successfully:', window.AvantosSdk)"
        onerror="handleSDKError(new Error('Failed to load SDK'))"></script>
</head>

<body class="p-8">
    <h1 class="text-2xl font-bold mb-4">Avantos UI SDK Demo</h1>
    <div id="root"></div>
    <script>
        function initApp() {
            try {
                if (typeof React === 'undefined') throw new Error('React not loaded');
                if (typeof ReactDOM === 'undefined') throw new Error('ReactDOM not loaded');
                if (typeof AvantosSdk === 'undefined') throw new Error('SDK not loaded');
                console.log('Initializing app with SDK:', AvantosSdk);

                const { Button } = AvantosSdk;
                if (!Button) throw new Error('Button component not found in SDK');

                const App = () => {
                    return React.createElement('div', null, [
                        React.createElement(Button, {
                            key: 'primary',
                            variant: 'primary',
                            size: 'medium',
                            onClick: () => alert('Primary clicked!')
                        }, 'Primary Button'),
                        React.createElement('div', { key: 'spacer', className: 'h-4' }),
                        React.createElement(Button, {
                            key: 'secondary',
                            variant: 'secondary',
                            size: 'medium',
                            onClick: () => alert('Secondary clicked!')
                        }, 'Secondary Button')
                    ]);
                };

                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            } catch (error) {
                console.error('Error initializing app:', error);
                handleSDKError(error);
            }
        }

        // Initialize when everything is loaded
        if (document.readyState === 'complete') {
            initApp();
        } else {
            window.addEventListener('load', initApp);
        }
    </script>
</body>

</html>
