<!DOCTYPE html>
<html>

<head>
    <title>SDK Test</title>
    <!-- Include React 18 -->
    <script>window.process = { env: { NODE_ENV: 'production' } };</script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Include our SDK (choose one of the following) -->
    <!-- Option 1: jsDelivr -->
    <script src="https://cdn.jsdelivr.net/gh/csbnapses/ui-sdk@main/dist/index.global.js"></script>
    <!-- Option 2: UNPKG -->
    <!-- <script src="https://unpkg.com/@avantos/ui-sdk@latest/dist/index.global.js"></script> -->
</head>

<body>
    <div id="root"></div>
    <script>
        // Wait for all scripts to load with a small delay
        setTimeout(() => {
            try {
                const { Button } = AvantosSdk;

                const App = () => {
                    return React.createElement(Button, {
                        variant: 'primary',
                        size: 'medium',
                        onClick: () => alert('Clicked!')
                    }, 'Click me');
                };

                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(App));
            } catch (error) {
                console.error('Error initializing app:', error);
            }
        }, 100);
    </script>
</body>

</html>
